name: Fetch News from The Hindu
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-and-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch RSS and save to JSON
        run: |
          npm install rss-parser
          node -e "
          const Parser = require('rss-parser');
          const fs = require('fs');
          const parser = new Parser();
          (async () => {
            try {
              const feed = await parser.parseURL('https://www.thehindu.com/feeder/default.rss');
              const items = feed.items.slice(0, 8).map(item => ({
                title: item.title,
                link: item.link,
                date: item.pubDate
              }));
              fs.writeFileSync('news.json', JSON.stringify({ source: 'The Hindu', items }, null, 2));
              console.log('Saved ' + items.length + ' items');
            } catch (err) {
              console.error('Error:', err.message);
              fs.writeFileSync('news.json', JSON.stringify({ source: 'The Hindu', items: [] }));
              process.exit(0);
            }
          })();
          "

      - name: Commit news.json
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update news"
          file_pattern: news.json
