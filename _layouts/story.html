<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | Verv</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@300;400;600&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-image: url('/originals-bg.png.avif');
            background-color: #fcf6e8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c2a26;
            line-height: 1.8;
            overflow-x: hidden;
            animation: fadeInPage 0.8s ease forwards;
            opacity: 0;
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }

        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.12) 100%);
            z-index: -1; pointer-events: none;
        }

        .back-btn {
            position: fixed; top: 20px; left: 20px;
            padding: 10px 20px;
            background: rgba(44, 42, 38, 0.1);
            color: #2c2a26; text-decoration: none; border-radius: 50px;
            font-family: 'Poppins', sans-serif; font-size: 0.9rem; font-weight: 600;
            backdrop-filter: blur(5px);
            transition: background 0.3s ease, transform 0.3s ease;
            z-index: 100;
        }
        .back-btn:hover { background: rgba(44, 42, 38, 0.2); transform: translateX(-3px); }

        .story-wrapper {
            max-width: 720px;
            margin: 0 auto;
            padding: 120px 30px 100px 30px;
        }

        .story-title {
            font-family: 'Abril Fatface', cursive;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            color: #1a1815;
            line-height: 1.1;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .story-meta {
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            color: #8a8781;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(44, 42, 38, 0.15);
        }

        .story-body p {
            font-size: 1.1rem;
            margin-bottom: 22px;
            color: #2c2a26;
        }

        .story-body p:first-of-type::first-letter {
            font-family: 'Abril Fatface', cursive;
            font-size: 4rem;
            float: left;
            line-height: 0.85;
            padding: 8px 12px 0 0;
            color: #1a1815;
        }

        .ad-space {
            margin: 40px 0;
            padding: 30px 20px;
            text-align: center;
            background: rgba(44, 42, 38, 0.04);
            border: 1px dashed rgba(44, 42, 38, 0.15);
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .story-end {
            text-align: center;
            margin-top: 60px;
            padding-top: 40px;
            border-top: 1px solid rgba(44, 42, 38, 0.15);
        }

        .story-end p {
            font-family: 'Poppins', sans-serif;
            font-size: 0.9rem;
            color: #8a8781;
            margin-bottom: 20px;
        }

        .story-end a {
            display: inline-block;
            color: #2c2a26;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-decoration: none;
            padding: 12px 28px;
            border: 1px solid #2c2a26;
            border-radius: 50px;
            transition: all 0.3s ease;
        }
        .story-end a:hover {
            background: #2c2a26;
            color: #fcf6e8;
        }

        .support-btn {
            position: fixed;
            bottom: 25px;
            right: 25px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 24px;
            background: #2c2a26;
            color: #fcf6e8;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 999;
        }
        .support-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 28px rgba(0,0,0,0.35);
        }

        @media (max-width: 768px) {
            .story-wrapper { padding: 100px 20px 100px 20px; }
            .story-body p { font-size: 1rem; }
            .support-btn { bottom: 15px; right: 15px; padding: 12px 18px; font-size: 0.75rem; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <a href="/originals.html" class="back-btn">← Back to The Originals</a>

    <article class="story-wrapper">
        <h1 class="story-title">{{ page.title }}</h1>
        <div class="story-meta">Published on {{ page.date | date: "%B %d, %Y" }} · by Verv</div>

        <div class="story-body">
            {{ content }}
        </div>

        <div class="story-end">
            <p>Thank you for reading.</p>
            <a href="/originals.html">Read More Stories →</a>
        </div>
    </article>

    <a href="https://buymeacoffee.com/vervreads" target="_blank" class="support-btn">
        ☕ Support the Writer
    </a>

</body>
</html>
