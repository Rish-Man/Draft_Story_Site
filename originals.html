<head>

    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Poppins:wght@300;400;600&family=Josefin+Sans:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { overflow-x: hidden; }

        body {
            background-image: url('originals-bg.png.avif');
            background-color: #fcf6e8;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            font-family: 'Josefin Sans', sans-serif;
            color: #2c2a26;
            line-height: 1.7;
            overflow-x: hidden;
            animation: fadeInPage 0.8s ease forwards;
            opacity: 0;
            -webkit-text-size-adjust: 100%;
        }
        @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }

        body::before {
            content: '';
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0,0,0,0.12) 100%);
            z-index: -1; pointer-events: none;
        }

        .back-btn {
            position: fixed; top: 20px; left: 20px;
            padding: 10px 20px;
            background: rgba(44, 42, 38, 0.1);
            color: #2c2a26; text-decoration: none; border-radius: 50px;
            font-family: 'Poppins', sans-serif; font-size: 0.85rem; font-weight: 600;
            backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
            transition: background 0.3s ease, transform 0.3s ease;
            z-index: 100;
            -webkit-tap-highlight-color: transparent;
        }
        .back-btn:hover { background: rgba(44, 42, 38, 0.2); transform: translateX(-3px); }

        .page-wrapper {
            max-width: 900px;
            margin: 0 auto;
            padding: clamp(100px, 15vw, 120px) 5vw 60px 5vw;
        }

        .originals-heading {
            font-family: 'Abril Fatface', cursive;
            font-size: clamp(2.5rem, 10vw, 6rem);
            color: #1a1815;
            line-height: 1.1;
            margin-bottom: 25px;
            text-align: center;
            letter-spacing: 1px;
        }

        .divider {
            width: 80px; height: 3px;
            background-color: #2c2a26;
            margin: 0 auto 40px auto;
            opacity: 0.5; border-radius: 2px;
        }

        .intro-text {
            font-size: clamp(0.95rem, 2.6vw, 1.1rem);
            text-align: center;
            max-width: 600px;
            margin: 0 auto 50px auto;
            color: #4a4741;
        }

        .section-heading {
            font-family: 'Abril Fatface', cursive;
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: #1a1815;
            margin: 40px 0 22px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(44, 42, 38, 0.15);
        }

        .story-link {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(44, 42, 38, 0.1);
            border-radius: 12px;
            padding: clamp(22px, 4vw, 30px);
            margin-bottom: 20px;
            transition: transform 0.3s ease, background 0.3s ease, box-shadow 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .story-link:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 25px rgba(0,0,0,0.06);
        }

        .story-link h3 {
            font-family: 'Abril Fatface', cursive;
            font-size: clamp(1.2rem, 3.5vw, 1.5rem);
            color: #1a1815;
            margin-bottom: 8px;
        }

        .story-link p {
            font-size: clamp(0.85rem, 2.3vw, 0.95rem);
            color: #4a4741;
            margin-bottom: 10px;
        }

        .story-link .read-more {
            font-family: 'Poppins', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #2c2a26;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .quick-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }

        .quick-link {
            display: block;
            text-decoration: none;
            color: inherit;
            background: rgba(44, 42, 38, 0.05);
            border: 1px solid rgba(44, 42, 38, 0.15);
            border-radius: 12px;
            padding: clamp(22px, 4vw, 30px);
            text-align: center;
            transition: transform 0.3s ease, background 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .quick-link:hover { transform: translateY(-3px); background: rgba(44, 42, 38, 0.1); }
        .quick-link h3 {
            font-family: 'Abril Fatface', cursive;
            font-size: clamp(1.1rem, 3.5vw, 1.4rem);
            color: #1a1815;
            margin-bottom: 8px;
        }
        .quick-link p {
            font-family: 'Poppins', sans-serif;
            font-size: 0.75rem;
            color: #6a6760;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .empty-note {
            background: rgba(44, 42, 38, 0.04);
            border: 1px dashed rgba(44, 42, 38, 0.15);
            border-radius: 12px;
            padding: 35px 25px;
            text-align: center;
            font-style: italic;
            color: #8a8781;
            margin-bottom: 20px;
            font-size: clamp(0.9rem, 2.4vw, 1rem);
        }

        .follow-btn {
            position: fixed; bottom: 20px; right: 20px;
            display: inline-flex; align-items: center; gap: 8px;
            padding: 14px 22px;
            background: #2c2a26; color: #fcf6e8;
            font-family: 'Poppins', sans-serif;
            font-size: 0.85rem; font-weight: 600; text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            z-index: 999;
            -webkit-tap-highlight-color: transparent;
        }
        .follow-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0,0,0,0.35); }

        footer {
            background: #fcf6e8;
            padding: 45px 5vw 35px 5vw;
            text-align: center;
            border-top: 1px solid rgba(44, 42, 38, 0.1);
            margin-top: 60px;
        }

        .footer-inner {
            max-width: 900px;
            margin: 0 auto;
        }

        .footer-logo {
            font-family: 'Abril Fatface', cursive;
            font-size: 1.5rem;
            color: #1a1815;
            margin-bottom: 18px;
            display: block;
            text-decoration: none;
        }

        .footer-links {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px 20px;
            flex-wrap: wrap;
            margin-bottom: 22px;
        }

        .footer-links a {
            color: #6a6760;
            text-decoration: none;
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: color 0.3s ease;
            padding: 6px 0;
            -webkit-tap-highlight-color: transparent;
        }
        .footer-links a:hover { color: #1a1815; }

        .footer-links .divider-dot { color: #b0aca0; font-size: 0.8rem; }

        .footer-copyright {
            font-family: 'Josefin Sans', sans-serif;
            font-size: 0.75rem;
            color: #8a8781;
            letter-spacing: 0.5px;
        }

        @media (max-width: 768px) {
            .quick-links { grid-template-columns: 1fr; }
            .back-btn { top: 15px; left: 15px; padding: 8px 16px; font-size: 0.8rem; }
            .follow-btn { bottom: 15px; right: 15px; padding: 12px 18px; font-size: 0.75rem; }
            footer { padding: 40px 5vw 30px 5vw; }
            .footer-links { flex-direction: column; gap: 4px; }
            .footer-links .divider-dot { display: none; }
            .footer
