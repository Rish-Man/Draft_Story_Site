<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verv - Stories & Jokes</title>

    <!-- Google Fonts: Pacifico for Script typography & Plus Jakarta Sans for body text -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* CSS Reset & Global Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000000;
            /* Direct background image without color tint filters */
            background-image: url('bg.png'); /* Change to your exact file name if different */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: #ffffff;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 200vh; /* Keeps page scrollable */
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Modern Navigation Bar Header */
        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            padding: 24px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
        }

        .brand-logo {
            font-family: 'Pacifico', cursive;
            font-size: 2rem;
            color: #ffffff;
        }

        .nav-tag {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.5);
            font-weight: 600;
        }

        /* Hero Section Styling - Modern Layout */
        .hero-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 220px 8% 100px 8%;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        /* Main Headline in Script Font */
        h1.hero-title {
            font-family: 'Pacifico', cursive;
            font-size: clamp(4.5rem, 12vw, 8.5rem);
            font-weight: 400;
            line-height: 1.1;
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        /* Subtitle / Description Text */
        p.hero-description {
            font-size: clamp(1.1rem, 2vw, 1.35rem);
            color: rgba(255, 255, 255, 0.75);
            max-width: 600px;
            font-weight: 300;
            line-height: 1.7;
            margin-bottom: 40px;
        }

        /* Top Banner Ad Space Placeholder */
        .ad-placeholder {
            width: 100%;
            max-width: 728px;
            height: 90px;
            margin: 40px 0;
            border: 1px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(6px);
        }

        /* Fixed "Support the Writer" Button Placeholder */
        .support-tip-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            padding: 14px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            cursor: pointer;
            z-index: 999;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .support-tip-btn:hover {
            background: #ffffff;
            color: #000000;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <!-- Header Navigation Bar -->
    <header>
        <div class="brand-logo">Verv</div>
        <div class="nav-tag">Edition 1.0</div>
    </header>

    <!-- Main Hero Landing Container -->
    <main class="hero-container">

        <h1 class="hero-title">Verv</h1>

        <p class="hero-description">
            Step into a universe of captivating short stories, mind-bending tales, and quick daily laughs designed for modern readers on the move.
        </p>

        <!-- Top Display Ad Placeholder Slot -->
        <!-- AD SPACE HERE -->
        <div class="ad-placeholder">
            <!-- AD SPACE HERE -->
            [ ADVERTISER SPACE ]
        </div>

    </main>

    <!-- Bottom Display Ad Placeholder Slot -->
    <div style="max-width: 1200px; margin: 100px auto 40px auto; padding: 0 8%;">
        <!-- AD SPACE HERE -->
        <div class="ad-placeholder" style="margin: 0 auto;">
            <!-- AD SPACE HERE -->
            [ BOTTOM DISPLAY AD SPACE ]
        </div>
    </div>

    <!-- Fixed Support the Writer Button -->
    <button class="support-tip-btn" onclick="alert('Thank you for supporting our writers!')">
        ☕ Support the Writer
    </button>

</body>
</html>
