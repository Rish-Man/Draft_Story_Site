<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verv | Stories & Jokes</title>
    
    <!-- 1. Import Pacifico Font from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        /* --- RESET & BASIC STYLES --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* 2. Background image is now set to bg.png */
            background-image: url('bg.png'); 
            
            /* Make the background cover the whole screen and stay fixed */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-color: #000; /* Fallback color if image fails */
            
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            height: 100vh;
            overflow-y: scroll; /* Allows scrolling */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* --- OVERLAY TO MAKE TEXT POP --- */
        /* Adds a subtle dark gradient over the image so white text is always readable */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.7) 100%);
            z-index: -1; /* Puts the overlay behind the content */
        }

        /* --- HERO SECTION (The main content) --- */
        .hero {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: flex-start; /* Aligns text to the left, like modern sites */
            min-height: 90vh; /* Takes up 90% of the screen height */
            width: 100%;
            max-width: 1200px;
            padding: 20px 40px;
            /* Push content down slightly so it's not perfectly centered */
            padding-top: 15vh; 
        }

        /* --- THE "VERV" TITLE --- */
        .brand-title {
            font-family: 'Pacifico', cursive;
            font-size: 6rem; /* Very large text */
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.6); /* Adds a glow/shadow */
            letter-spacing: 2px;
            line-height: 1.1;
        }

        /* --- DESCRIPTION TEXT --- */
        .description {
            font-size: 1.2rem;
            font-weight: 300;
            line-height: 1.6;
            max-width: 600px; /* Prevents text from stretching too wide */
            color: #e0e0e0;
            
            /* Glassmorphism Effect (Frosted glass look) */
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        /* --- SCROLL INDICATOR --- */
        /* Just a little visual cue that you can scroll down */
        .scroll-indicator {
            margin-top: 50px;
            font-size: 0.9rem;
            color: #aaa;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.8;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-5px);}
            60% {transform: translateY(-5px);}
        }

        /* --- RESPONSIVE DESIGN (For Phones) --- */
        @media (max-width: 768px) {
            .brand-title {
                font-size: 4rem;
            }
            .description {
                font-size: 1rem;
                padding: 20px;
            }
            .hero {
                align-items: center; /* Center on mobile */
                text-align: center;
                padding-top: 25vh;
            }
        }
    </style>
</head>
<body>

    <!-- HERO SECTION -->
    <main class="hero">
        <h1 class="brand-title">Verv</h1>
        
        <div class="description">
            <p>Welcome to Verv. Dive into a curated collection of captivating stories, quick-witted jokes, and creative writing. We bring you the best content to brighten your day and spark your imagination. Scroll down to explore.</p>
        </div>

        <!-- Small visual cue to scroll -->
        <div class="scroll-indicator">
            <span>Scroll for more</span>
            <span>↓</span>
        </div>
    </main>

    <!-- Empty space below to allow scrolling (for future buttons) -->
    <div style="height: 50vh; width: 100%;"></div>

</body>
</html>
